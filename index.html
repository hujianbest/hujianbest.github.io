<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hujianbest · 技术博客</title>
    <meta name="description" content="hujianbest 的个人技术博客，记录架构设计、源码阅读与工程实践。">
    <style>
        :root {
            --apple-bg: #f5f5f7;
            --apple-text: #1d1d1f;
            --apple-secondary: #86868b;
            --apple-card-bg: rgba(255, 255, 255, 0.9);
            --apple-blur: blur(24px);
            --transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            --link-color: #0066cc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--apple-bg);
            color: var(--apple-text);
            min-height: 100vh;
            background: radial-gradient(circle at top, #ffffff 0%, #f5f5f7 60%, #e5e5ea 100%);
        }

        .page {
            position: relative;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 48px 24px 56px;
            position: relative;
            z-index: 1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.04em;
        }

        .logo span {
            opacity: 0.6;
            font-weight: 500;
            margin-left: 6px;
            font-size: 14px;
        }

        nav {
            display: flex;
            gap: 20px;
            font-size: 14px;
        }

        nav a {
            color: var(--apple-text);
            text-decoration: none;
            opacity: 0.7;
            transition: var(--transition);
        }

        nav a:hover {
            opacity: 1;
        }

        .hero {
            display: grid;
            grid-template-columns: minmax(0, 2fr) minmax(0, 1.4fr);
            gap: 40px;
            align-items: center;
            margin-bottom: 40px;
        }

        .hero-title {
            font-size: 48px;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
        }

        .hero-subtitle {
            font-size: 20px;
            color: var(--apple-secondary);
            margin-bottom: 24px;
            max-width: 28rem;
        }

        .hero-meta {
            font-size: 14px;
            color: var(--apple-secondary);
        }

        .hero-actions {
            margin-top: 24px;
            display: flex;
            gap: 16px;
        }

        .hero-actions a {
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(0,0,0,0.08);
            background: rgba(255,255,255,0.9);
            backdrop-filter: var(--apple-blur);
            -webkit-backdrop-filter: var(--apple-blur);
            box-shadow: 0 18px 40px rgba(0,0,0,0.08);
            color: var(--apple-text);
            transition: var(--transition);
        }

        .hero-actions a.primary {
            background: #000;
            color: #fff;
            border-color: #000;
            box-shadow: 0 18px 40px rgba(0,0,0,0.22);
        }

        .hero-actions a:hover {
            transform: translateY(-2px);
            box-shadow: 0 24px 50px rgba(0,0,0,0.15);
        }

        .hero-actions svg {
            transition: transform 0.3s ease;
        }

        .hero-actions a:hover svg {
            transform: translateX(2px);
        }

        .hero-highlight {
            background: var(--apple-card-bg);
            backdrop-filter: var(--apple-blur);
            -webkit-backdrop-filter: var(--apple-blur);
            border-radius: 32px;
            padding: 28px 26px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.14);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        .hero-highlight h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .hero-highlight p {
            font-size: 14px;
            color: var(--apple-secondary);
            line-height: 1.6;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(0,0,0,0.06);
            font-size: 12px;
            color: var(--apple-secondary);
            margin-bottom: 12px;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 999px;
            background: #34c759;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .post-card {
            background: rgba(255,255,255,0.9);
            border-radius: 24px;
            padding: 20px 20px 18px;
            border: 1px solid rgba(0,0,0,0.06);
            box-shadow: 0 20px 45px rgba(0,0,0,0.06);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: var(--transition);
        }

        .post-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 26px 60px rgba(0,0,0,0.12);
        }

        .post-meta {
            font-size: 12px;
            color: var(--apple-secondary);
        }

        .post-title {
            font-size: 16px;
            font-weight: 600;
        }

        .post-desc {
            font-size: 13px;
            color: var(--apple-secondary);
        }

        .post-tags {
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 999px;
            background: rgba(0,0,0,0.04);
            color: var(--apple-secondary);
        }

        .categories {
            margin-top: 32px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .category-pill {
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(0,0,0,0.04);
            color: var(--apple-secondary);
        }

        .bg-blob {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(66, 185, 131, 0.16) 0%, rgba(255, 255, 255, 0) 70%);
            border-radius: 50%;
            z-index: 0;
            filter: blur(50px);
        }

        .blob-1 { top: -200px; left: -220px; }
        .blob-2 { bottom: -220px; right: -240px; }

        footer {
            margin-top: 40px;
            font-size: 12px;
            color: var(--apple-secondary);
            text-align: center;
        }

        footer a {
            color: var(--link-color);
            text-decoration: none;
        }

        @media (max-width: 900px) {
            .hero {
                grid-template-columns: minmax(0, 1fr);
            }
            .hero-title {
                font-size: 34px;
            }
            .hero-subtitle {
                font-size: 17px;
            }
            .hero-highlight {
                order: -1;
            }
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .container {
                padding-inline: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="bg-blob blob-1"></div>
        <div class="bg-blob blob-2"></div>

        <div class="container">
            <header>
                <div class="logo">
                    hujianbest
                    <span>Tech Blog</span>
                </div>
                <nav>
                    <a href="/blog/">博客</a>
                    <a href="/blog/#/about">关于</a>
                    <a href="/blog/admin/">写作</a>
                    <a href="https://github.com/hujianbest" target="_blank" rel="noopener noreferrer">GitHub</a>
                </nav>
            </header>

            <main>
                <section class="hero">
                    <div>
                        <div class="badge">
                            <span class="badge-dot"></span>
                            个人技术博客
                        </div>
                        <h1 class="hero-title">平凡之路上的技术与思考。</h1>
                        <p class="hero-subtitle">
                            记录架构设计、源码阅读与工程实践，把日常开发中的经验沉淀成可以复用的知识。
                        </p>
                        <p class="hero-meta">
                            写 Markdown 放到 <code>blog/articles</code>，推送到 GitHub 即可完成部署。
                        </p>
                        <div class="hero-actions">
                            <a href="/blog/" class="primary">
                                开始阅读
                                <svg width="7" height="11" viewBox="0 0 7 11" fill="none">
                                    <path d="M1 1L5.5 5.5L1 10" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </a>
                            <a href="/blog/admin/">
                                在线写一篇
                                <svg width="7" height="11" viewBox="0 0 7 11" fill="none">
                                    <path d="M1 1L5.5 5.5L1 10" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </a>
                        </div>
                    </div>
                    <div class="hero-highlight">
                        <h2>最近文章</h2>
                        <p id="recent-posts-desc">从左侧导航或下方列表进入你感兴趣的内容。</p>
                        <div class="posts-grid" id="posts-grid">
                            <!-- 最近文章将通过 JS 注入 -->
                        </div>
                        <div class="categories">
                            <div class="category-pill">架构设计</div>
                            <div class="category-pill">源码阅读</div>
                            <div class="category-pill">工程实践</div>
                        </div>
                    </div>
                </section>
            </main>

            <footer>
                © <span id="year"></span> hujianbest · 部署于 GitHub Pages · 内容以 Markdown 维护
            </footer>
        </div>
    </div>

    <script>
        // 简单从 blog/README.md 中提取“最近文章”链接
        async function loadRecentPosts() {
            const grid = document.getElementById('posts-grid');
            const desc = document.getElementById('recent-posts-desc');
            try {
                const res = await fetch('/blog/README.md');
                if (!res.ok) throw new Error('README not found');
                const text = await res.text();
                const lines = text.split('\n');
                const posts = [];
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line.startsWith('### [')) {
                        const match = line.match(/^### \[(.+?)\]\((.+?)\)/);
                        if (match) {
                            const title = match[1];
                            const path = match[2];
                            let date = '';
                            const next = (lines[i + 1] || '').trim();
                            const dateMatch = next.match(/^发布日期：(.+)/);
                            if (dateMatch) {
                                date = dateMatch[1].trim();
                            }
                            posts.push({
                                title,
                                path,
                                date,
                                link: '/blog/#/' + path.replace(/^\.\//, '')
                            });
                        }
                    }
                }
                if (!posts.length) {
                    desc.textContent = '暂时没有配置最近文章，请在 blog/README.md 中维护最近文章列表。';
                    return;
                }
                // 只展示前 4 篇
                posts.slice(0, 4).forEach(post => {
                    const a = document.createElement('a');
                    a.className = 'post-card';
                    a.href = post.link;
                    a.innerHTML = `
                        <div class="post-meta">${post.date || '最近更新'}</div>
                        <div class="post-title">${post.title}</div>
                        <div class="post-desc">点击在博客中查看全文。</div>
                    `;
                    grid.appendChild(a);
                });
            } catch (e) {
                desc.textContent = '读取最近文章失败，但不影响通过导航进入博客阅读。';
            }
        }

        document.getElementById('year').textContent = new Date().getFullYear();
        loadRecentPosts();
    </script>
</body>
</html>
