<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>hujianbest的平凡之路</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="hujianbest的个人技术博客，记录技术学习、项目经验和生活感悟">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="theme-color" content="#42b983">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/prismjs/themes/prism-tomorrow.min.css">
  <style>
    /* 自定义样式 */
    :root {
      --theme-color: #42b983;
      --sidebar-width: 300px;
    }
    
    /* 页面过渡动画 */
    .app-name-link img {
      max-width: 80%;
    }
    
    .markdown-section {
      max-width: 900px;
      padding: 2rem 45px;
    }
    
    @media screen and (max-width: 768px) {
      .markdown-section {
        padding: 1.5rem 20px;
      }
    }
    
    /* 文章卡片样式 */
    .article-card {
      background: #fff;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    
    .article-card:hover {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      transform: translateY(-2px);
    }
    
    .article-card h3 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 1.4rem;
    }
    
    .article-card time {
      color: #888;
      font-size: 0.9rem;
      display: block;
      margin-bottom: 10px;
    }
    
    .article-card p {
      color: #555;
      margin-bottom: 0;
    }
    
    /* 代码块样式优化 */
    .markdown-section pre > code {
      border-radius: 6px;
    }
    
    /* 进度条样式 */
    .progress {
      position: fixed;
      top: 0;
      left: 0;
      width: 0%;
      height: 3px;
      background: var(--theme-color);
      z-index: 9999;
      transition: width 0.2s;
    }
  </style>
</head>
<body>
  <!-- 阅读进度条 -->
  <div class="progress"></div>
  
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'hujianbest的平凡之路',
      repo: 'hujianbest/hujianbest.github.io',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',
      coverpage: true,
      onlyCover: false,
      coverpageButton: '开始阅读',
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索',
        noData: '没有找到结果',
        depth: 6
      },
      pagination: {
        previousText: '上一章节',
        nextText: '下一章节',
      },
      copyCode: {
        buttonText : '复制',
        errorText  : '错误',
        successText: '已复制'
      },
      // 页面加载动画
      themeColor: '#42b983',
      // 代码高亮配置
      highlight: {
        auto: true,
        tab: '  '
      },
      // 图片放大配置
      zoomImage: {
        imgSelection: true,
        delay: 300
      }
    }
  </script>
  
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  
  <!-- 插件 -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-count/dist/countable.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  
  <!-- 代码高亮支持 -->
  <script src="//cdn.jsdelivr.net/npm/prismjs/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs/components/prism-javascript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs/components/prism-typescript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs/components/prism-css.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs/components/prism-java.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs/components/prism-json.min.js"></script>
  
  <!-- 阅读进度条脚本 -->
  <script>
    window.onscroll = function() {
      var winScroll = document.body.scrollTop || document.documentElement.scrollTop;
      var height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      var scrolled = (winScroll / height) * 100;
      document.querySelector(".progress").style.width = scrolled + "%";
    };
    
    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', function() {
      // 可以在这里添加更多自定义功能
    });
  </script>
</body>
</html>
