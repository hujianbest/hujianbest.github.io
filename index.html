<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hujianbest的个人空间</title>
    <style>
        :root {
            --apple-bg: #f5f5f7;
            --apple-text: #1d1d1f;
            --apple-card-bg: rgba(255, 255, 255, 0.8);
            --apple-blur: blur(20px);
            --transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--apple-bg);
            color: var(--apple-text);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #ffffff 0%, #f5f5f7 100%);
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 40px;
            text-align: center;
            z-index: 1;
        }

        h1 {
            font-size: 48px;
            font-weight: 600;
            letter-spacing: -0.015em;
            margin-bottom: 16px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s forwards;
        }

        p.subtitle {
            font-size: 24px;
            color: #86868b;
            margin-bottom: 60px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s 0.2s forwards;
        }

        .cards {
            display: flex;
            gap: 30px;
            justify-content: center;
            perspective: 1000px;
        }

        .card {
            background: var(--apple-card-bg);
            backdrop-filter: var(--apple-blur);
            -webkit-backdrop-filter: var(--apple-blur);
            width: 400px;
            height: 500px;
            border-radius: 30px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-decoration: none;
            color: inherit;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04);
            transition: var(--transition);
            opacity: 0;
            transform: translateY(30px);
            position: relative;
            overflow: hidden;
        }

        .card:nth-child(1) { animation: fadeInUp 0.8s 0.4s forwards; }
        .card:nth-child(2) { animation: fadeInUp 0.8s 0.6s forwards; }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0.9);
        }

        .card-content {
            text-align: left;
            z-index: 2;
        }

        .card-tag {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #86868b;
            margin-bottom: 10px;
            display: block;
        }

        .card-title {
            font-size: 32px;
            font-weight: 600;
            line-height: 1.1;
            margin-bottom: 15px;
        }

        .card-desc {
            font-size: 17px;
            color: #86868b;
            line-height: 1.47;
        }

        .card-footer {
            text-align: left;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
            color: #0066cc;
            z-index: 2;
        }

        .card-footer svg {
            transition: transform 0.3s ease;
        }

        .card:hover .card-footer svg {
            transform: translateX(3px);
        }

        /* Background elements */
        .bg-blob {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(66, 185, 131, 0.1) 0%, rgba(255, 255, 255, 0) 70%);
            border-radius: 50%;
            z-index: 0;
            filter: blur(50px);
        }

        .blob-1 { top: -200px; left: -200px; }
        .blob-2 { bottom: -200px; right: -200px; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 900px) {
            .cards {
                flex-direction: column;
                align-items: center;
            }
            .card {
                width: 100%;
                max-width: 400px;
                height: 400px;
            }
            body {
                overflow: auto;
            }
        }
    </style>
</head>
<body>
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

    <div class="container">
        <h1>hujianbest</h1>
        <p class="subtitle">平凡之路，光影随行</p>

        <div class="cards">
            <a href="/blog/" class="card">
                <div class="card-content">
                    <span class="card-tag">Blog</span>
                    <h2 class="card-title">文字记录</h2>
                    <p class="card-desc">记录技术学习、项目经验和生活感悟。在代码的世界里寻找诗意。</p>
                </div>
                <div class="card-footer">
                    阅读更多
                    <svg width="7" height="11" viewBox="0 0 7 11" fill="none">
                        <path d="M1 1L5.5 5.5L1 10" stroke="#0066cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </a>

            <a href="/photography/" class="card">
                <div class="card-content">
                    <span class="card-tag">Photography</span>
                    <h2 class="card-title">光影瞬间</h2>
                    <p class="card-desc">捕捉生活中的美好瞬间。用镜头记录这个世界的温度与色彩。</p>
                </div>
                <div class="card-footer">
                    进入画廊
                    <svg width="7" height="11" viewBox="0 0 7 11" fill="none">
                        <path d="M1 1L5.5 5.5L1 10" stroke="#0066cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </a>
        </div>
    </div>
</body>
</html>
