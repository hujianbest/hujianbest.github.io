<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光影瞬间 - hujianbest</title>
    <style>
        :root {
            --apple-bg: #ffffff;
            --apple-text: #1d1d1f;
            --apple-secondary: #86868b;
            --transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--apple-bg);
            color: var(--apple-text);
            -webkit-font-smoothing: antialiased;
        }

        header {
            padding: 80px 40px 40px;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .header-content h1 {
            font-size: 48px;
            font-weight: 600;
            letter-spacing: -0.015em;
        }

        .header-content p {
            font-size: 21px;
            color: var(--apple-secondary);
            margin-top: 8px;
        }

        .back-home {
            text-decoration: none;
            color: #0066cc;
            font-weight: 500;
            font-size: 17px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .back-home:hover {
            text-decoration: underline;
        }

        .gallery {
            padding: 20px 40px 80px;
            max-width: 1400px;
            margin: 0 auto;
            column-count: 3;
            column-gap: 20px;
        }

        .photo-item {
            break-inside: avoid;
            margin-bottom: 20px;
            border-radius: 20px;
            overflow: hidden;
            background: #f5f5f7;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }

        .photo-item img {
            width: 100%;
            display: block;
            transition: var(--transition);
        }

        .photo-item:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .photo-item:hover img {
            transform: scale(1.05);
        }

        .photo-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.5));
            color: white;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .photo-item:hover .photo-info {
            opacity: 1;
        }

        .photo-title {
            font-weight: 600;
            font-size: 17px;
        }

        /* Modal */
        #modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.98);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        #modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.2);
        }

        .close-modal {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 30px;
            cursor: pointer;
            color: var(--apple-text);
        }

        @media (max-width: 1100px) {
            .gallery { column-count: 2; }
        }

        @media (max-width: 700px) {
            header { flex-direction: column; align-items: flex-start; gap: 20px; padding-top: 40px; }
            .gallery { column-count: 1; padding: 20px; }
            .header-content h1 { font-size: 32px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>光影瞬间</h1>
            <p>捕捉生活中的美好瞬间</p>
        </div>
        <a href="/" class="back-home">
            <svg width="7" height="11" viewBox="0 0 7 11" fill="none" style="transform: rotate(180deg)">
                <path d="M1 1L5.5 5.5L1 10" stroke="#0066cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            返回首页
        </a>
    </header>

    <div class="gallery" id="gallery">
        <!-- 图片将通过 JS 动态加载 -->
        <div id="loading-msg" style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--apple-secondary);">
            正在加载作品集...
        </div>
    </div>

    <div id="modal">
        <span class="close-modal">&times;</span>
        <img id="modal-img" src="" alt="">
    </div>

    <script>
        // 摄影作品目录
        const PHOTOS_DIR = 'photos/';
        // 允许的图片扩展名
        const EXTENSIONS = ['jpg', 'jpeg', 'png', 'webp', 'gif'];

        async function loadPhotos() {
            const gallery = document.getElementById('gallery');
            const loadingMsg = document.getElementById('loading-msg');

            try {
                // 由于 GitHub Pages 是静态的，我们无法直接列出目录
                // 我们尝试读取一个由脚本生成的 photos.json 文件，如果不存在则回退到手动配置或提示
                const response = await fetch('photos.json');
                if (!response.ok) throw new Error('photos.json not found');
                
                const photos = await response.json();
                
                if (photos.length === 0) {
                    loadingMsg.innerHTML = '暂无摄影作品，请将图片放入 photography/photos/ 目录。';
                    return;
                }

                loadingMsg.remove();

                photos.forEach(photo => {
                    const item = document.createElement('div');
                    item.className = 'photo-item';
                    
                    const img = document.createElement('img');
                    img.src = PHOTOS_DIR + photo.filename;
                    img.alt = photo.title || photo.filename;
                    img.loading = 'lazy';

                    const info = document.createElement('div');
                    info.className = 'photo-info';
                    info.innerHTML = `<div class="photo-title">${photo.title || ''}</div>`;

                    item.appendChild(img);
                    item.appendChild(info);
                    
                    item.onclick = () => showModal(img.src);
                    
                    gallery.appendChild(item);
                });
            } catch (error) {
                console.error('Error loading photos:', error);
                loadingMsg.innerHTML = '请确保 photography/photos/ 目录下有图片，并运行生成脚本。';
                
                // 演示模式：如果没有 photos.json，可以尝试显示一些说明
                loadingMsg.innerHTML += '<br><br><small style="color:#999">提示：你需要运行 generate_photos.py 来更新作品列表</small>';
            }
        }

        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modal-img');
        const closeBtn = document.querySelector('.close-modal');

        function showModal(src) {
            modal.style.display = 'flex';
            modalImg.src = src;
            document.body.style.overflow = 'hidden';
        }

        closeBtn.onclick = () => {
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        };

        modal.onclick = (e) => {
            if (e.target === modal) closeBtn.onclick();
        };

        window.onload = loadPhotos;
    </script>
</body>
</html>
