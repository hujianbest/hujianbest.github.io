<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>写作 · hujianbest 技术博客</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="在浏览器中撰写 Markdown，通过 GitHub API 发布到 blog/articles 和 blog/images。" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.css" />
  <style>
    :root {
      --text: #1d1d1f;
      --secondary: #8e8e93;
      --accent: #0066cc;
      --success: #34c759;
      --danger: #ff3b30;
      --border: rgba(0, 0, 0, 0.08);
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: var(--font-sans); color: var(--text); overflow: hidden; }
    .app { display: flex; flex-direction: column; height: 100vh; }
    .topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: rgba(255,255,255,0.95);
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .topbar .logo { font-size: 16px; font-weight: 600; }
    .topbar .logo span { font-size: 12px; color: var(--secondary); font-weight: 500; margin-left: 6px; }
    .topbar a { font-size: 13px; color: var(--secondary); text-decoration: none; }
    .topbar a:hover { color: var(--accent); }
    .topbar .btn {
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background: #f0f0f2;
      color: var(--text);
    }
    .topbar .btn:hover { background: #e5e5ea; }
    .topbar .btn.primary { background: #000; color: #fff; }
    .topbar .btn.primary:hover { background: #333; }
    .main {
      flex: 1;
      display: flex;
      min-height: 0;
      background: #fafafa;
    }
    .editor-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-right: 1px solid var(--border);
    }
    .editor-wrap .EasyMDEContainer { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    .editor-wrap .CodeMirror-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .editor-wrap .CodeMirror { flex: 1; min-height: 0; }
    .editor-wrap .CodeMirror-scroll { min-height: 100%; }
    .preview-wrap {
      flex: 1;
      min-width: 0;
      overflow: auto;
      padding: 24px 32px 48px;
      background: #fff;
    }
    .preview-content {
      max-width: 720px;
      margin: 0 auto;
      font-size: 15px;
      line-height: 1.7;
    }
    .preview-content h1 { font-size: 1.85em; margin: 0.6em 0 0.4em; }
    .preview-content h2 { font-size: 1.5em; margin: 0.8em 0 0.4em; }
    .preview-content h3 { font-size: 1.25em; margin: 0.8em 0 0.3em; }
    .preview-content p { margin: 0.5em 0; }
    .preview-content ul, .preview-content ol { margin: 0.5em 0; padding-left: 1.5em; }
    .preview-content code { background: #f0f0f2; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
    .preview-content pre { background: #1d1d1f; color: #f5f5f7; padding: 14px; border-radius: 8px; overflow: auto; }
    .preview-content pre code { background: none; padding: 0; color: inherit; }
    .preview-content blockquote { border-left: 4px solid var(--accent); margin: 0.8em 0; padding-left: 1em; color: var(--secondary); }
    .preview-content img { max-width: 100%; height: auto; border-radius: 6px; }
    .preview-placeholder { color: var(--secondary); font-size: 14px; }
    .drawer-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 100;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .drawer-overlay.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed; top: 0; right: 0; width: 400px; max-width: 100%; height: 100%;
      background: #fff; box-shadow: -4px 0 24px rgba(0,0,0,0.12); z-index: 101;
      transform: translateX(100%); transition: transform 0.25s ease;
      overflow-y: auto; padding: 20px 24px 32px;
    }
    .drawer.open { transform: translateX(0); }
    .drawer h2 { font-size: 16px; margin-bottom: 16px; }
    .drawer label { display: block; font-size: 12px; color: var(--secondary); margin-bottom: 4px; }
    .drawer input[type="text"], .drawer input[type="date"] {
      width: 100%; padding: 8px 10px; margin-bottom: 12px; border-radius: 8px;
      border: 1px solid var(--border); font-size: 13px;
    }
    .drawer .field-row { display: flex; gap: 10px; }
    .drawer .field-row > div { flex: 1; }
    .drawer .tiny { font-size: 11px; color: var(--secondary); margin-top: 2px; margin-bottom: 8px; }
    .drawer hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
    .drawer .btn { padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; border: none; margin-right: 8px; margin-top: 4px; }
    .drawer .btn.secondary { background: #f0f0f2; color: var(--text); }
    .drawer .btn.primary { background: #000; color: #fff; }
    .drawer .status { font-size: 12px; margin-top: 8px; min-height: 18px; }
    .drawer .status.ok { color: var(--success); }
    .drawer .status.error { color: var(--danger); }
    .drawer .images-list { font-size: 12px; max-height: 120px; overflow: auto; margin-top: 4px; }
    .code-inline { font-family: ui-monospace, monospace; font-size: 11px; background: #f0f0f2; padding: 2px 5px; border-radius: 4px; }
    @media (max-width: 900px) {
      .main { flex-direction: column; }
      .preview-wrap { border-top: 1px solid var(--border); }
      .drawer { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-left">
        <span class="logo">写作 <span>Writing Studio</span></span>
        <button type="button" class="btn" id="open-drawer">设置</button>
        <a href="/">首页</a>
        <a href="/blog/">博客</a>
      </div>
      <div>
        <button type="button" class="btn primary" id="publish-btn">发布</button>
      </div>
    </header>
    <div class="main">
      <div class="editor-wrap">
        <textarea id="editor" placeholder="在此撰写 Markdown，右侧实时预览。"></textarea>
      </div>
      <div class="preview-wrap">
        <div id="preview" class="preview-content">
          <p class="preview-placeholder">输入内容后将在右侧显示预览。</p>
        </div>
      </div>
    </div>
  </div>
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <aside class="drawer" id="drawer">
    <h2>发布设置</h2>
    <div>
      <label for="token">GitHub Token</label>
      <input id="token" type="text" class="token-input" placeholder="ghp_xxx 或 fine-grained token" />
      <div class="tiny">仅存于本机，建议为本仓库创建细粒度 Token（Contents: 读写）。</div>
    </div>
    <div class="field-row">
      <div><label for="owner">Owner</label><input id="owner" type="text" /></div>
      <div><label for="repo">Repo</label><input id="repo" type="text" /></div>
    </div>
    <div><label for="branch">分支</label><input id="branch" type="text" /><div class="tiny">如 main / master</div></div>
    <hr />
    <div><label for="title">文章标题</label><input id="title" type="text" placeholder="例如：架构设计心得" /></div>
    <div><label for="slug">文件名（可留空）</label><input id="slug" type="text" placeholder="架构设计心得.md" /><div class="tiny">保存到 <span class="code-inline">blog/articles/</span></div></div>
    <div class="field-row">
      <div><label for="date">发布日期</label><input id="date" type="date" /></div>
      <div><label for="tags">标签（逗号分隔）</label><input id="tags" type="text" placeholder="架构, 源码" /></div>
    </div>
    <div><label for="category">分类</label><input id="category" type="text" placeholder="架构设计 / 源码阅读" /></div>
    <hr />
    <div>
      <label for="image-input">文章图片</label>
      <input id="image-input" type="file" accept="image/*" multiple />
      <div class="tiny">上传到 <span class="code-inline">blog/images/</span>，文中用 <span class="code-inline">![](../images/文件名)</span></div>
      <div class="images-list" id="images-list"></div>
    </div>
    <div>
      <button type="button" class="btn secondary" id="save-config">保存配置</button>
      <span class="status" id="config-status"></span>
    </div>
    <div style="margin-top: 12px;">
      <span class="status" id="publish-status"></span>
    </div>
  </aside>

  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.js"></script>
  <script>
    const STORAGE_KEY = "hjb_blog_admin_config_v1";
    const DEFAULT_CONFIG = { owner: "hujianbest", repo: "hujianbest.github.io", branch: "master" };
    let selectedImages = [];
    let easyMDE;

    const els = {
      token: document.getElementById("token"),
      owner: document.getElementById("owner"),
      repo: document.getElementById("repo"),
      branch: document.getElementById("branch"),
      title: document.getElementById("title"),
      slug: document.getElementById("slug"),
      date: document.getElementById("date"),
      tags: document.getElementById("tags"),
      category: document.getElementById("category"),
      imageInput: document.getElementById("image-input"),
      imagesList: document.getElementById("images-list"),
      saveConfig: document.getElementById("save-config"),
      configStatus: document.getElementById("config-status"),
      publishBtn: document.getElementById("publish-btn"),
      publishStatus: document.getElementById("publish-status"),
      preview: document.getElementById("preview"),
      drawer: document.getElementById("drawer"),
      drawerOverlay: document.getElementById("drawer-overlay"),
      openDrawer: document.getElementById("open-drawer"),
    };

    function openDrawer() { els.drawer.classList.add("open"); els.drawerOverlay.classList.add("open"); }
    function closeDrawer() { els.drawer.classList.remove("open"); els.drawerOverlay.classList.remove("open"); }
    els.openDrawer.addEventListener("click", openDrawer);
    els.drawerOverlay.addEventListener("click", closeDrawer);

    marked.setOptions({ gfm: true, breaks: true });
    function updatePreview(md) {
      if (!md || !md.trim()) {
        els.preview.innerHTML = '<p class="preview-placeholder">输入内容后将在右侧显示预览。</p>';
        return;
      }
      try {
        els.preview.innerHTML = marked.parse(md);
      } catch (e) {
        els.preview.innerHTML = '<p class="preview-placeholder">预览解析异常，请检查 Markdown 语法。</p>';
      }
    }

    easyMDE = new EasyMDE({
      element: document.getElementById("editor"),
      placeholder: "在此撰写 Markdown，右侧实时预览。",
      spellChecker: false,
      autofocus: true,
      toolbar: ["bold", "italic", "heading", "|", "quote", "unordered-list", "ordered-list", "|", "link", "image", "|", "fullscreen", "guide"],
      status: false,
      minHeight: "calc(100vh - 52px)",
    });
    easyMDE.codemirror.on("change", function () { updatePreview(easyMDE.value()); });

    function loadConfig() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          els.owner.value = DEFAULT_CONFIG.owner;
          els.repo.value = DEFAULT_CONFIG.repo;
          els.branch.value = DEFAULT_CONFIG.branch;
          els.date.value = new Date().toISOString().slice(0, 10);
          return;
        }
        const cfg = JSON.parse(raw);
        els.token.value = cfg.token || "";
        els.owner.value = cfg.owner || DEFAULT_CONFIG.owner;
        els.repo.value = cfg.repo || DEFAULT_CONFIG.repo;
        els.branch.value = cfg.branch || DEFAULT_CONFIG.branch;
        els.date.value = cfg.date || new Date().toISOString().slice(0, 10);
        els.tags.value = cfg.tags || "";
        if (cfg.title !== undefined) els.title.value = cfg.title;
        if (cfg.slug !== undefined) els.slug.value = cfg.slug;
        if (cfg.category !== undefined) els.category.value = cfg.category;
      } catch (e) { console.warn("load config failed", e); }
    }
    function saveConfigToLocal() {
      const cfg = {
        token: els.token.value.trim(),
        owner: els.owner.value.trim(),
        repo: els.repo.value.trim(),
        branch: els.branch.value.trim(),
        date: els.date.value,
        tags: els.tags.value.trim(),
        title: els.title.value.trim(),
        slug: els.slug.value.trim(),
        category: els.category.value.trim()
      };
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
        els.configStatus.textContent = "已保存到本机。";
        els.configStatus.className = "status ok";
      } catch (e) {
        els.configStatus.textContent = "保存失败：" + e.message;
        els.configStatus.className = "status error";
      }
    }
    els.saveConfig.addEventListener("click", saveConfigToLocal);

    function buildFrontMatter() {
      const title = els.title.value.trim();
      const date = els.date.value || new Date().toISOString().slice(0, 10);
      const tags = els.tags.value.split(",").map((t) => t.trim()).filter(Boolean);
      const category = els.category.value.trim();
      const lines = ["---"];
      if (title) lines.push('title: "' + title.replace(/"/g, '\\"') + '"');
      if (date) lines.push("date: " + date);
      if (category) lines.push('category: "' + category.replace(/"/g, '\\"') + '"');
      if (tags.length) lines.push("tags: [" + tags.map((t) => '"' + t.replace(/"/g, '\\"') + '"').join(", ") + "]");
      lines.push("---", "");
      return lines.join("\n");
    }
    function base64EncodeUnicode(str) { return btoa(unescape(encodeURIComponent(str))); }
    async function githubRequest(path, options) {
      const token = els.token.value.trim();
      if (!token) throw new Error("请先填写 GitHub Token。");
      const res = await fetch("https://api.github.com" + path, {
        ...options,
        headers: { "Content-Type": "application/json", Authorization: "token " + token, ...(options && options.headers) },
      });
      if (!res.ok) throw new Error("GitHub API " + res.status + ": " + (await res.text()));
      return res.json();
    }
    function encodePath(path) {
      return path.split("/").map(encodeURIComponent).join("/");
    }
    async function getFileSha(owner, repo, path, branch) {
      try {
        const data = await githubRequest("/repos/" + owner + "/" + repo + "/contents/" + encodePath(path) + "?ref=" + encodeURIComponent(branch), { method: "GET" });
        return data.sha;
      } catch (e) { if (String(e.message).includes("404")) return null; throw e; }
    }
    async function upsertTextFile(owner, repo, branch, filePath, content, message) {
      const sha = await getFileSha(owner, repo, filePath, branch);
      const body = { message, content: base64EncodeUnicode(content), branch };
      if (sha) body.sha = sha;
      return githubRequest("/repos/" + owner + "/" + repo + "/contents/" + encodePath(filePath), { method: "PUT", body: JSON.stringify(body) });
    }
    function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => { const r = reader.result; resolve(r.indexOf(",") !== -1 ? r.slice(r.indexOf(",") + 1) : r); };
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }
    async function upsertBinaryFile(owner, repo, branch, filePath, file, message) {
      const sha = await getFileSha(owner, repo, filePath, branch);
      const body = { message, content: await readFileAsBase64(file), branch };
      if (sha) body.sha = sha;
      return githubRequest("/repos/" + owner + "/" + repo + "/contents/" + encodePath(filePath), { method: "PUT", body: JSON.stringify(body) });
    }
    async function getFileContent(owner, repo, filePath, branch) {
      const data = await githubRequest("/repos/" + owner + "/" + repo + "/contents/" + encodePath(filePath) + "?ref=" + encodeURIComponent(branch), { method: "GET" });
      if (data.encoding === "base64" && data.content) {
        try {
          return decodeURIComponent(escape(atob(data.content.replace(/\s/g, ""))));
        } catch (e) { throw new Error("解码文件内容失败"); }
      }
      throw new Error("无法读取文件内容");
    }
    function buildArticlePath() {
      let slug = els.slug.value.trim();
      const title = els.title.value.trim();
      if (!slug) slug = title || "未命名文章";
      if (!slug.endsWith(".md")) slug += ".md";
      return "blog/articles/" + slug;
    }
    function articlePathToLinkSlug(articlePath) {
      const base = articlePath.replace(/^blog\/articles\//i, "").replace(/\.md$/i, "");
      return base;
    }
    function collectImageTargets() { return selectedImages.map((file) => ({ file, name: file.name, targetPath: "blog/images/" + file.name })); }

    async function handlePublish() {
      const owner = els.owner.value.trim(), repo = els.repo.value.trim(), branch = els.branch.value.trim(), title = els.title.value.trim();
      if (!owner || !repo || !branch) { els.publishStatus.textContent = "请填写仓库 Owner、Repo、分支。"; els.publishStatus.className = "status error"; return; }
      if (!title) { els.publishStatus.textContent = "请填写文章标题。"; els.publishStatus.className = "status error"; return; }
      const frontMatter = buildFrontMatter();
      const body = easyMDE.value() || "";
      const fullContent = frontMatter + body;
      const articlePath = buildArticlePath();
      const linkSlug = articlePathToLinkSlug(articlePath);
      const images = collectImageTargets();
      const date = els.date.value || new Date().toISOString().slice(0, 10);
      els.publishBtn.disabled = true;
      els.publishStatus.textContent = "正在发布…";
      els.publishStatus.className = "status";
      try {
        const message = "chore(blog): add " + title;
        await upsertTextFile(owner, repo, branch, articlePath, fullContent, message);
        for (const item of images) await upsertBinaryFile(owner, repo, branch, item.targetPath, item.file, message);
        els.publishStatus.textContent = "发布成功：" + articlePath + (images.length ? "，上传 " + images.length + " 张图。" : "。");
        els.publishStatus.className = "status ok";

        try {
          const sidebarPath = "blog/_sidebar.md";
          let sidebarRaw = await getFileContent(owner, repo, sidebarPath, branch);
          const sidebarLines = sidebarRaw.split("\n");
          let insertIdx = sidebarLines.findIndex((l) => l.trim() === "* 博客文章" || l.includes("博客文章"));
          if (insertIdx === -1) insertIdx = sidebarLines.length;
          let lastChild = insertIdx;
          for (let i = insertIdx + 1; i < sidebarLines.length; i++) {
            if (sidebarLines[i].startsWith("  * ")) lastChild = i;
            else if (sidebarLines[i].startsWith("* ") && !sidebarLines[i].startsWith("*  ")) break;
          }
          const newLine = "  * [" + title + "](articles/" + linkSlug + ")";
          if (!sidebarRaw.includes("](articles/" + linkSlug + ")")) {
            sidebarLines.splice(lastChild + 1, 0, newLine);
            await upsertTextFile(owner, repo, branch, sidebarPath, sidebarLines.join("\n"), "chore(blog): sidebar add " + title);
            els.publishStatus.textContent += " 已更新侧栏。";
          }
        } catch (e) { console.warn("更新侧栏失败", e); els.publishStatus.textContent += " 侧栏未更新。"; }

        try {
          const readmePath = "blog/README.md";
          let readmeRaw = await getFileContent(owner, repo, readmePath, branch);
          const recentHeading = readmeRaw.match(/\n(##\s*[^\n]*最近文章[^\n]*)\n/);
          if (recentHeading) {
            const idx = readmeRaw.indexOf(recentHeading[0]) + recentHeading[0].length;
            const block = "\n### [" + title + "](articles/" + linkSlug + ")\n发布日期：" + date + "\n\n";
            if (!readmeRaw.includes("](articles/" + linkSlug + ")")) {
              readmeRaw = readmeRaw.slice(0, idx) + block + readmeRaw.slice(idx);
              await upsertTextFile(owner, repo, branch, readmePath, readmeRaw, "chore(blog): recent add " + title);
              els.publishStatus.textContent += " 已更新博客首页。";
            }
          }
        } catch (e) { console.warn("更新博客首页失败", e); els.publishStatus.textContent += " 首页未更新。"; }
      } catch (e) {
        console.error(e);
        els.publishStatus.textContent = "发布失败：" + e.message;
        els.publishStatus.className = "status error";
      } finally { els.publishBtn.disabled = false; }
    }
    els.publishBtn.addEventListener("click", handlePublish);

    function handleImagesChange(e) {
      selectedImages = Array.from(e.target.files || []);
      els.imagesList.innerHTML = "";
      if (!selectedImages.length) { els.imagesList.textContent = "未选图片"; return; }
      selectedImages.forEach((file) => {
        const div = document.createElement("div");
        div.innerHTML = file.name + " → <span class=\"code-inline\">![](../images/" + file.name + ")</span>";
        els.imagesList.appendChild(div);
      });
    }
    els.imageInput.addEventListener("change", handleImagesChange);

    loadConfig();
    els.imagesList.textContent = "未选图片";
  </script>
</body>
</html>
